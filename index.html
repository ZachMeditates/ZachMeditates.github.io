<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zach Wallace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#16241f; --rule:#2f433c; --text:#dfe3dc; --text-soft:#b9c4bd; --head:#efe8d4;
  --lamp:#e2a24a; --lamp-soft:#f3d9ae; --paper:#ebe7d6; --paper-edge:#c9c2a8; --ink:#2b2a24; --ink-soft:#4a463b;
  --glass:rgba(16,28,24,.82);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#16241f;--text:#dfe3dc;--head:#efe8d4;--glass:rgba(16,28,24,.82)}}
:root[data-theme="dark"]{--ground:#16241f;--text:#dfe3dc;--head:#efe8d4}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--text);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;font-size:1.05rem;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
.serif{font-family:"IM Fell English",Georgia,"Times New Roman",serif;font-weight:400}
a{color:var(--lamp)} a:hover{color:var(--lamp-soft)}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
button{font:inherit}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,3%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(4,8,7,.75) 100%)}

/* top bar */
.bar{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:calc(env(safe-area-inset-top,0px) + .9rem) clamp(1rem,4vw,2.5rem) .9rem;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.name{white-space:nowrap;font-size:1.45rem;color:var(--head);letter-spacing:.01em;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.bar .tools{display:flex;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:0 1rem;background:rgba(16,28,24,.55);border:1px solid rgba(223,227,220,.25);color:var(--text);cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip:hover{border-color:var(--lamp);color:var(--lamp-soft)}
.chip svg{flex:none}

/* zone labels in the scene */
.zlabel{position:fixed;left:0;top:0;transform:translate(-50%,-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:.25rem;min-height:44px;padding:.55rem 1rem;background:rgba(16,28,24,.5);border:1px solid rgba(226,162,74,.55);color:var(--lamp-soft);cursor:pointer;white-space:nowrap;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .4s ease,border-color .2s}
.zlabel:hover{border-color:var(--lamp)}
.zlabel .t{font-family:"IM Fell English",Georgia,serif;font-size:1.2rem;color:var(--head)}
.zlabel .s{font-size:.82rem;color:var(--text-soft)}
.zlabel[hidden]{display:none}
body.zoomed .zlabel{opacity:0;pointer-events:none}

/* bottom nav (always available, keyboard and fallback) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem;padding:.9rem 1rem calc(env(safe-area-inset-bottom,0px) + .9rem);pointer-events:none}
.nav button{pointer-events:auto}
.nav{display:none}
body.zoomed .nav{opacity:0;pointer-events:none}
.nav button[aria-current="true"]{border-color:var(--lamp);color:var(--lamp-soft)}

/* panel */
.panel{position:fixed;z-index:6;background:var(--glass);border-left:1px solid var(--rule);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;
  top:0;right:0;bottom:0;width:min(28rem,100%);padding:calc(env(safe-area-inset-top,0px) + 1.25rem) 1.5rem calc(env(safe-area-inset-bottom,0px) + 1.5rem);transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain}
.panel.open{transform:none}
@media (max-width:44rem){
  .panel{top:auto;left:0;width:100%;max-height:64%;border-left:0;border-top:1px solid var(--rule);transform:translateY(105%);padding-top:1.1rem}
}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.panel h2{margin:0;font-size:2.3rem;line-height:1.05;color:var(--head)}
.panel .intro{margin:.4rem 0 1.2rem;color:var(--text-soft)}
.close{flex:none;min-height:44px;padding:0 1rem;background:transparent;border:1px solid var(--rule);color:var(--text);cursor:pointer}
.close:hover{border-color:var(--lamp)}
.tags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.9rem}
.tag{position:relative;background:var(--paper);color:var(--ink);padding:1rem 1.2rem 1.1rem 3.1rem;clip-path:polygon(1.4rem 0,100% 0,100% 100%,1.4rem 100%,0 calc(100% - 1.4rem),0 1.4rem);opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
.panel.open .tag{opacity:1;transform:none}
.tag::before{content:"";position:absolute;left:1.15rem;top:50%;width:.9rem;height:.9rem;margin-top:-.45rem;border-radius:50%;background:var(--ground);box-shadow:0 0 0 3px var(--paper-edge)}
.tag h3{margin:0;font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:1.45rem;line-height:1.15}
.tag p{margin:.3rem 0 0;color:var(--ink-soft);line-height:1.45}
.tag a{display:inline-flex;align-items:center;min-height:44px;color:#6a3b1f;font-weight:700}
.more{display:inline-flex;align-items:center;min-height:44px;margin-top:.1rem;padding:0;background:none;border:0;color:#6a3b1f;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.more:hover{color:#3f220f}
.detail .from{margin:0 0 .4rem;color:var(--text-soft);font-size:.95rem}
.detail h4{margin:1.2rem 0 .25rem;font-size:1.25rem;color:var(--lamp-soft);font-style:italic}
.detail p{margin:0;color:#d3d9d2;line-height:1.6}
.dback{margin-top:1.6rem;min-height:44px;padding:0 1rem;background:transparent;border:1px solid var(--rule);color:var(--text);cursor:pointer}
.dback:hover{border-color:var(--lamp)}
.about p{color:var(--text-soft);margin:0 0 1rem}
.motto{font-style:italic;font-size:1.5rem;line-height:1.35;color:var(--head)!important}
.contact{list-style:none;margin:.5rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.75rem}
.contact a{display:inline-flex;align-items:center;gap:.6rem;min-height:48px;padding:0 1.1rem;border:1px solid var(--rule);color:var(--text);text-decoration:none}
.contact a:hover{border-color:var(--lamp);color:var(--lamp-soft)}
.about .checked{margin:1.6rem 0 0;font-size:.85rem;color:var(--text-soft);opacity:.8}

/* intro gate */
.gate{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;padding:0 clamp(1.25rem,6vw,5rem) calc(env(safe-area-inset-bottom,0px) + clamp(2.5rem,8vh,5rem));background:linear-gradient(rgba(10,18,16,.2),rgba(10,18,16,.85));transition:opacity 1.2s ease}
.gate.gone{opacity:0;pointer-events:none}
.gate .in{display:flex;flex-direction:column;gap:1.1rem;max-width:40rem}
.gate h1{margin:0;font-size:clamp(3.2rem,10vw,6.5rem);line-height:.95;color:var(--head)}
.gate p{margin:0;font-size:1.2rem;color:#cfd6cf}
.gate .row{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.4rem}
.enter{min-height:48px;padding:0 1.5rem;border:1px solid var(--lamp);background:rgba(22,36,31,.6);color:var(--lamp-soft);cursor:pointer}
.enter.quiet{border-color:rgba(223,227,220,.3);color:var(--text)}
.enter:hover{background:rgba(226,162,74,.12)}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.6rem);transform:translateX(-50%);z-index:3;font-size:.9rem;color:var(--text-soft);pointer-events:none;transition:opacity 1s;text-shadow:0 1px 8px #000}
.fallback{display:none;position:fixed;inset:0;overflow:auto;background:#16241f center/cover no-repeat;padding:6rem 1.5rem 3rem}
.nogl .fallback{display:block} .nogl #scene,.nogl .zlabel,.nogl .hint{display:none}
@media (max-width:30rem){.zlabel{display:none!important}.name{font-size:1.2rem}.bar .chip{padding:0 .75rem}#soundlbl,#flashlbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.nav{display:flex;flex-wrap:nowrap;gap:.35rem;padding-left:.6rem;padding-right:.6rem}.nav .chip{font-size:.88rem;padding:0 .6rem}.hint{bottom:calc(env(safe-area-inset-bottom,0px) + 4.6rem);white-space:nowrap;font-size:.82rem}}
@media (prefers-reduced-motion:reduce){.grain{animation:none}.panel,.tag,.gate{transition:none}}
</style>
<noscript><style>.gate,.bar,.nav,.hint{display:none!important}</style></noscript>
</head>
<body>
<canvas id="scene" aria-label="A foggy greenhouse at night with three groups of plants" role="img"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="bar">
  <span class="name serif">Zach Wallace</span>
  <div class="tools">
    <button class="chip" id="sound" type="button" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path id="wave" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 7a7 7 0 0 1 0 10" stroke-linecap="round"/></svg><span id="soundlbl">Sound off</span></button>
    <button class="chip" id="about" type="button">About</button>
  </div>
</header>

<button class="zlabel" type="button" data-zone="into" hidden><span class="t">What I&rsquo;m into</span></button>
<button class="zlabel" type="button" data-zone="built" hidden><span class="t">What I&rsquo;ve built</span></button>
<button class="zlabel" type="button" data-zone="do" hidden><span class="t">What I do</span></button>

<div class="hint" id="hint">Drag to look around. Tap a lamp or a bench.</div>

<nav class="nav" aria-label="Sections">
  <button class="chip" type="button" data-zone="do">What I do</button>
  <button class="chip" type="button" data-zone="built">What I&rsquo;ve built</button>
  <button class="chip" type="button" data-zone="into">What I&rsquo;m into</button>
</nav>

<aside class="panel" id="panel" aria-labelledby="ptitle" aria-hidden="true">
  <div class="ph"><h2 class="serif" id="ptitle"></h2><button class="close" type="button" id="pclose">Back to the aisle</button></div>
  <p class="intro" id="pintro"></p>
  <div id="pbody"></div>
</aside>

<div class="gate" id="gate">
  <div class="in">
    <h1 class="serif">Zach Wallace</h1>
    <p>Things I make and grow after hours: projects, hobbies, and experiments.</p>
    <div class="row">
      <button class="enter" type="button" id="enterSound">Enter with sound</button>
      <button class="enter quiet" type="button" id="enterQuiet">Enter quietly</button>
    </div>
  </div>
</div>

<noscript><div style="position:fixed;inset:0;overflow:auto;background:#16241f;color:#dfe3dc;padding:2rem;font-family:Georgia,serif"><h1>Zach Wallace</h1><h2>What I do</h2><ul><li><strong>Software QA, compliance, and test automation</strong>: Finding what breaks, proving what works, and automating the rest.</li><li><strong>Playwright and TypeScript</strong>: Automating the repetitive parts of manual testing, not just writing test suites.</li><li><strong>Claude Code and AI</strong>: Building with AI, and getting better at it.</li><li><strong>Data scraping</strong>: Turning scattered public records into clean, usable data.</li><li><strong>Cooking</strong>: A big meal from scratch every week, with fresh garlic and onions, good ingredients, and avocado oil. Cutting vegetables is how I unwind.</li><li><strong>Gardening and houseplants</strong>: A seven-foot monstera and a house full of plants, plus a garden every spring.</li></ul><h2>What I’ve built</h2><ul><li><strong>Meadow</strong>: A personal relationship tracker you text. It remembers the details about your friends and reminds you to check in.</li><li><strong>Opportunity tracker</strong>: Every weekday it scans new contract opportunities, scores each one for fit, and sends the team a ranked shortlist in chat and email. It runs on GitHub Actions and raises a flag if a run ever gets skipped.</li><li><strong>Record matching pipeline</strong>: Python in Snowflake that pulls several messy sources into one clean master list, where the same organization had been typed countless different ways.</li><li><strong>API automation in Postman</strong>: Hours of repetitive manual lookups turned into Postman collections that call several APIs, fill in the gaps, and hand a person only the cases that need judgment.</li><li><strong>Home media server</strong>: A home server for our own movie collection.</li><li><strong>Home automation</strong>: Music in every room, and lights that set the scene: purple when the Ravens are on, off on a schedule.</li></ul><h2>What I’m into</h2><ul><li><strong>Movies and TV</strong>: Comedies, scary things, and weird things. The Matrix first, always.</li><li><strong>Music</strong>: Always hunting for something new: Tycho, Bonobo, Minus the Bear, Tanerélle, Notorious B.I.G., 2 Chainz, Curren$y, and Danny Brown.</li><li><strong>Psychology and the mind</strong>: How people think, decide, and connect. A long shelf of Kevin Mitnick.</li><li><strong>Video games</strong>: Silent Hill above all: every game, in its original format. Also Red Dead Redemption 2, Resident Evil, Grand Theft Auto V, and the Jedi games.</li><li><strong>Drones</strong>: Grounded for now, until I have gear that can handle the footage.</li><li><strong>Books and rabbit holes</strong>: Researching whatever has my attention. The Demon-Haunted World, Rosemary’s Baby, and the High Republic series.</li><li><strong>Star Wars, Lego, and Disney World</strong>: Always up for any of the three.</li></ul><p><a href="https://github.com/ZachMeditates" style="color:#e2a24a">GitHub</a> and <a href="mailto:zachwallace@protonmail.com" style="color:#e2a24a">email</a></p></div></noscript>

<script>
const SECTIONS = {"do": {"title": "What I do", "intro": "Work I know deeply, and things I do every week.", "items": [{"title": "Software QA, compliance, and test automation", "line": "Finding what breaks, proving what works, and automating the rest."},{"title": "Playwright and TypeScript", "line": "Automating the repetitive parts of manual testing, not just writing test suites.", "detail": {"focus": 0, "sections": [["The stack", "Playwright drives a real browser the way a person would. TypeScript is the language I write it in."], ["How I use it", "Not only for automated test suites. I point it at the repetitive parts of manual testing, the setup, the data entry, and the same screens clicked through again and again, so my time goes to the testing that actually needs a person."], ["Why it matters", "Manual testing gets faster, and the steps a script handles come out the same every time."]]}},{"title": "Claude Code and AI", "line": "Building with AI, and getting better at it."},{"title": "Data scraping", "line": "Turning scattered public records into clean, usable data."},{"title": "Cooking", "line": "A big meal from scratch every week, with fresh garlic and onions, good ingredients, and avocado oil. Cutting vegetables is how I unwind."},{"title": "Gardening and houseplants", "line": "A seven-foot monstera and a house full of plants, plus a garden every spring.", "detail": {"focus": 1, "sections": [["Indoors", "A monstera that has grown to about seven feet, and a handful of other plants around the house, cared for on a regular routine."], ["The spring garden", "Tomatoes, okra, cucumbers, potatoes, carrots, and herbs, usually mint and basil."], ["The experiment", "Cotton, once, just to try it."]]}}]}, "built": {"title": "What I’ve built", "intro": "Things I made or set up myself.", "items": [{"title": "Meadow", "line": "A personal relationship tracker you text. It remembers the details about your friends and reminds you to check in.", "url": "https://www.textmeadow.com/", "detail": {"focus": 1, "sections": [["The idea", "People mean to keep in touch, then forget the birthday, the new job, or how long it has been since they talked."], ["How it works", "You text it about the people in your life and it remembers. Once a week it sends a short list of who to check in with, with a message drafted for each. A web dashboard shows everything it knows."], ["Where it stands", "Built and working, with a landing page. Paused while I focus on other things."]]}},{"title": "Opportunity tracker", "line": "Every weekday it scans new contract opportunities, scores each one for fit, and sends the team a ranked shortlist in chat and email. It runs on GitHub Actions and raises a flag if a run ever gets skipped."},{"title": "Record matching pipeline", "line": "Python in Snowflake that pulls several messy sources into one clean master list, where the same organization had been typed countless different ways.", "detail": {"focus": 3, "sections": [["The problem", "The same organization showed up under endless spellings, with gaps everywhere, so nothing could be counted or reported on with confidence."], ["How it works", "Python notebooks in Snowflake pull the sources together, match records that mean the same thing, and build a single master list. Confident matches link on their own; the rest go to a person to review."], ["Why it matters", "A pile of data nobody trusted became one list people can actually report on."]]}},{"title": "API automation in Postman", "line": "Hours of repetitive manual lookups turned into Postman collections that call several APIs, fill in the gaps, and hand a person only the cases that need judgment."},{"title": "Home media server", "line": "A home server for our own movie collection."},{"title": "Home automation", "line": "Music in every room, and lights that set the scene: purple when the Ravens are on, off on a schedule."}]}, "into": {"title": "What I’m into", "intro": "Interests I keep coming back to.", "items": [{"title": "Movies and TV", "line": "Comedies, scary things, and weird things. The Matrix first, always.", "detail": {"focus": 0, "sections": [["Movies", "The Matrix, at number one. Then Midsommar, Saltburn, The Usual Suspects, Rosemary’s Baby, The Man Who Knew Too Little, and Star Wars."], ["TV", "Severance, Andor, Mr. Robot, The Magicians, Stargate SG-1, Ted Lasso, The Studio, Silicon Valley, Only Murders in the Building, Veep, and Trailer Park Boys."], ["The long arc", "Breaking Bad, mostly for the way one character changes over five seasons."]]}},{"title": "Music", "line": "Always hunting for something new: Tycho, Bonobo, Minus the Bear, Tanerélle, Notorious B.I.G., 2 Chainz, Curren$y, and Danny Brown."},{"title": "Psychology and the mind", "line": "How people think, decide, and connect. A long shelf of Kevin Mitnick.", "detail": {"focus": 3, "sections": [["Background", "I studied psychology: how people work, the brain, and social psychology."], ["Reading", "A long shelf of Kevin Mitnick, and anything on how people think, decide, and get persuaded."]]}},{"title": "Video games", "line": "Silent Hill above all: every game, in its original format. Also Red Dead Redemption 2, Resident Evil, Grand Theft Auto V, and the Jedi games.", "detail": {"focus": 9, "sections": [["Silent Hill", "Every Silent Hill game, each in its original format, with 1, 2, and 3 at the top. Currently playing Silent Hill Townfall and Silent Hill f."], ["Why it sticks", "The fog, the sound, and the music. Some of that mood found its way into this greenhouse."], ["Everything else", "Red Dead Redemption 2, Resident Evil: Director’s Cut, Grand Theft Auto V, Jedi: Fallen Order, Jedi: Survivor, and Spycraft: The Great Game."]]}},{"title": "Drones", "line": "Grounded for now, until I have gear that can handle the footage."},{"title": "Books and rabbit holes", "line": "Researching whatever has my attention. The Demon-Haunted World, Rosemary’s Baby, and the High Republic series."},{"title": "Star Wars, Lego, and Disney World", "line": "Always up for any of the three."}]}};

(function(){ const mt=canvasTex(256,256,(g,w,h)=>{ g.clearRect(0,0,w,h); const gr=g.createRadialGradient(128,128,0,128,128,64); gr.addColorStop(0,'#f4f1e6'); gr.addColorStop(.85,'#dcd8c8'); gr.addColorStop(1,'#cfcab8'); g.fillStyle=gr; g.beginPath(); g.arc(128,128,64,0,6.3); g.fill();
    g.save(); g.beginPath(); g.arc(128,128,64,0,6.3); g.clip(); for(let i=0;i<26;i++){ const r=Math.random()*12+2; g.fillStyle='rgba(120,118,105,'+(.12+Math.random()*.18)+')'; g.beginPath(); g.arc(78+Math.random()*100,78+Math.random()*100,r,0,6.3); g.fill(); }
    g.fillStyle='rgba(150,148,135,.22)'; g.beginPath(); g.ellipse(110,112,30,20,.6,0,6.3); g.fill(); g.restore(); });
  const disc=new THREE.Sprite(new THREE.SpriteMaterial({map:mt,transparent:true,fog:false,depthWrite:false,opacity:.5})); disc.scale.set(8,8,1); disc.position.set(16,20,-50); scene.add(disc);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:T.glow,color:0x9fb4d4,blending:THREE.AdditiveBlending,transparent:true,fog:false,depthWrite:false,opacity:.28})); halo.scale.set(40,40,1); halo.position.copy(disc.position); scene.add(halo);
  window.__moon={disc,halo}; })();

/* fog banks */
const fogs=[];
for(let i=0;i<42;i++){const low=i<20; const s=new THREE.Sprite(new THREE.SpriteMaterial({map:T.fog,transparent:true,opacity:(low?.12:.07)+Math.random()*.06,depthWrite:false}));
  const sc=low?2+Math.random()*2.5:3+Math.random()*3.5; s.scale.set(sc*1.8,sc*(low?.45:1),1); s.position.set((Math.random()-.5)*7,low?.12+Math.random()*.35:.6+Math.random()*1.6,Z0-Math.random()*L); scene.add(s); fogs.push({s,v:(Math.random()-.5)*.1,ph:Math.random()*6,base:s.position.clone(),off:new THREE.Vector3()});}
/* moths and dust */
const MN=lamps.length*5; const mothG=new THREE.BufferGeometry(); mothG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(MN*3),3));
scene.add(new THREE.Points(mothG,new THREE.PointsMaterial({color:0xe9dcc4,size:.022,transparent:true,opacity:.85})));
const mothP=[...Array(MN)].map((_,i)=>({l:lamps[i%lamps.length],r:.22+Math.random()*.35,s:.8+Math.random()*1.8,ph:Math.random()*6.28,y:(Math.random()-.5)*.3}));
const DN=260; const dustG=new THREE.BufferGeometry(); const dp=new Float32Array(DN*3); for(let i=0;i<DN;i++){dp[i*3]=(Math.random()-.5)*5; dp[i*3+1]=Math.random()*3; dp[i*3+2]=Z0-Math.random()*L;} dustG.setAttribute('position',new THREE.BufferAttribute(dp,3));
scene.add(new THREE.Points(dustG,new THREE.PointsMaterial({color:0xcfc6b0,size:.012,transparent:true,opacity:.5,depthWrite:false})));

/* ---------- zones: back (do), right side (built), left side (into) ---------- */
const ZONES={
  into:{cam:new THREE.Vector3(.75,1.55,-3.4),look:new THREE.Vector3(-1.95,.95,-5.1),label:new THREE.Vector3(-1.9,1.35,-4.6)},
  built:{cam:new THREE.Vector3(-.75,1.6,-3.2),look:new THREE.Vector3(1.95,1.15,-4.9),label:new THREE.Vector3(1.9,1.85,-4.6)},
  do:{cam:new THREE.Vector3(0,1.95,-8.6),look:new THREE.Vector3(0,1.7,-14.2),label:new THREE.Vector3(0,2.95,-14.0)}
};
const HOME={cam:new THREE.Vector3(0,1.65,1.4),look:new THREE.Vector3(0,1.25,-11)};
const camPos=HOME.cam.clone(), camLook=HOME.look.clone(), tgtPos=HOME.cam.clone(), tgtLook=HOME.look.clone();
camera.position.copy(camPos); camera.lookAt(camLook);
const hitMat=new THREE.MeshBasicMaterial({visible:false}); const hits=[];
[['into',-1.9,-4.8,1.4,5.6],['built',1.9,-4.8,1.4,5.6],['do',0,-14,6,6.5]].forEach(([k,x,z,w,d])=>{const h=new THREE.Mesh(new THREE.BoxGeometry(w,3,d),hitMat); h.position.set(x,1.5,z); h.userData.zone=k; scene.add(h); hits.push(h);});

/* ---------- interaction ---------- */
const pointer={x:-9999,y:-9999,active:false}; const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2(); let parX=0,parY=0;
function onMove(e){const r=canvas.getBoundingClientRect(); pointer.x=e.clientX-r.left; pointer.y=e.clientY-r.top; pointer.active=true; parX=pointer.x/r.width-.5; parY=pointer.y/r.height-.5;
  if(!current){ndc.set(pointer.x/r.width*2-1,-(pointer.y/r.height)*2+1); ray.setFromCamera(ndc,camera); canvas.style.cursor=(ray.intersectObjects(lampHits)[0]||ray.intersectObjects(hits)[0])?'pointer':'default';}}
canvas.addEventListener('pointermove',onMove); canvas.addEventListener('pointerdown',onMove); canvas.addEventListener('pointerleave',()=>{pointer.active=false;});
let downAt=null, last=null; const look={yaw:0,pitch:0,drag:false};
canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY]; last=[e.clientX,e.clientY]; try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
canvas.addEventListener('pointermove',e=>{ if(!last) return; const dx=e.clientX-last[0], dy=e.clientY-last[1]; last=[e.clientX,e.clientY];
  if(Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>10){ look.drag=true; look.yaw=Math.max(-.65,Math.min(.65,look.yaw-dx*.0035)); look.pitch=Math.max(-.35,Math.min(.35,look.pitch-dy*.0028)); } });
window.__lamp=(i)=>lampClick(i);
function lampClick(i){ const l=lamps[i]; l.level=l.level>.5?.18:1; l.flick=.45; l.vel+=(Math.random()<.5?-1:1)*.9; Audio.play('chain',.25,.2); }
canvas.addEventListener('pointerup',e=>{ if(!downAt) return; const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]); downAt=null; if(moved>10) return;
  const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);
  const lh=ray.intersectObjects(lampHits)[0]; if(lh){ lampClick(lh.object.userData.lamp); return; }
  if(current){closeZone();return;} const hit=ray.intersectObjects(hits)[0]; if(hit) openZone(hit.object.userData.zone);});

canvas.addEventListener('pointercancel',()=>{ last=null; look.drag=false; downAt=null; });
function openZone(k){

  const Z=ZONES[k]; tgtPos.copy(Z.cam); tgtLook.copy(Z.look);
  const dir=new THREE.Vector3().subVectors(Z.look,Z.cam).normalize(); const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
  if(window.innerWidth>704) tgtLook.addScaledVector(right,.85); else tgtLook.y-=1.0;
  showPanel(SECTIONS[k].title,SECTIONS[k].intro,tagsHTML(SECTIONS[k].items,k)); if(was!==k) Audio.confirm();
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.zone===k?'true':'false'));
  plants.forEach(p=>{ if(p.anchor.distanceTo(Z.label)<3.5) p.rustle=1; });
}
function openDetail(k,i){
  const it=SECTIONS[k].items[i]; if(!it||!it.detail) return; current=k; document.body.classList.add('zoomed');
  const P=ZP[k][it.detail.focus]||ZP[k][0]; const a=P.anchor.clone(); const side=a.x<0?1:-1;
  const look=new THREE.Vector3(a.x,a.y+.1,a.z); const cam=new THREE.Vector3(a.x+side*1.55,a.y+.35,a.z+1.2);

  tgtPos.copy(cam); tgtLook.copy(look);
  const dir=new THREE.Vector3().subVectors(look,cam).normalize(); const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
  if(window.innerWidth>704) tgtLook.addScaledVector(right,.55); else tgtLook.y-=.55;
  P.rustle=1; showPanel(it.title,null,detailHTML(k,it)); Audio.confirm();
}
window.__detail=openDetail;
function closeZone(){ if(!current) return; current=null; document.body.classList.remove('zoomed'); tgtPos.copy(HOME.cam); tgtLook.copy(HOME.look); hidePanel(); Audio.back();
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current','false'));}
window.__open=openZone;

/* ---------- loop ---------- */
const clock=new THREE.Clock(); const tmp=new THREE.Vector3(); const UP=new THREE.Vector3(0,1,0); const labels={}; document.querySelectorAll('.zlabel').forEach(b=>labels[b.dataset.zone]=b);
function resize(){const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<h?72:56; camera.updateProjectionMatrix();}
window.addEventListener('resize',resize); resize();

/* ---------- post-processing (desktop): bloom and depth of field, loaded on demand ---------- */
const post={on:false,ready:false,focus:6,aperture:.0006};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s);});}
if(!isPhone && !reduce){
  const EX='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/';
  ['shaders/CopyShader.js','shaders/LuminosityHighPassShader.js','shaders/BokehShader.js','shaders/GammaCorrectionShader.js','postprocessing/EffectComposer.js','postprocessing/RenderPass.js','postprocessing/ShaderPass.js','postprocessing/UnrealBloomPass.js','postprocessing/BokehPass.js']
   .reduce((p,f)=>p.then(()=>loadScript(EX+f)),Promise.resolve()).then(()=>{
    const w=window.innerWidth,h=window.innerHeight;
    const pr=renderer.getPixelRatio(); const rt=new THREE.WebGLRenderTarget(w*pr,h*pr,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,encoding:THREE.sRGBEncoding}); const comp=new THREE.EffectComposer(renderer,rt); comp.addPass(new THREE.RenderPass(scene,camera));
    const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(w,h),.35,.4,.9); comp.addPass(bloom);
    const bokeh=new THREE.BokehPass(scene,camera,{focus:6,aperture:.0006,maxblur:.009,width:w,height:h}); comp.addPass(bokeh);
    post.comp=comp; post.bokeh=bokeh; post.bloom=bloom; post.ready=true; post.on=true; window.__post=post;
    window.addEventListener('resize',()=>{comp.setSize(window.innerWidth,window.innerHeight);});
  }).catch(()=>{ post.ready=false; });
}
/* automatic quality: step down if frames drop */
const perf={frames:0,t0:performance.now(),slow:0,level:0};
const dbg=/[?&]debug=1/.test(location.search)?(()=>{const d=document.createElement('div'); d.style.cssText='position:fixed;left:8px;bottom:8px;z-index:20;font:12px monospace;color:#cfc;background:rgba(0,0,0,.6);padding:4px 6px'; document.body.appendChild(d); return d;})():null;
function checkPerf(){ perf.frames++; const now=performance.now(); if(now-perf.t0<2000) return; const fps=perf.frames*1000/(now-perf.t0); perf.frames=0; perf.t0=now;
  if(dbg) dbg.textContent=fps.toFixed(0)+' fps, quality '+(3-perf.level);
  if(!gateGone||/[?&]noauto=1/.test(location.search)) return; if(fps<40) perf.slow++; else perf.slow=0; if(perf.slow<2) return; perf.slow=0;
  if(post.on||(VB&&VB.material.uniforms.uStrength.value>0)){ post.on=false; if(VB){ VB.material.uniforms.uStrength.value=0; VB.visible=false; } perf.level=1; }
  else if(renderer.shadowMap.enabled){ renderer.shadowMap.enabled=false; scene.traverse(o=>{ if(o.isLight) o.castShadow=false; if(o.material){ [].concat(o.material).forEach(m=>m.needsUpdate=true);} }); perf.level=2; }
  else if(renderer.getPixelRatio()>1){ renderer.setPixelRatio(1); resize(); perf.level=3; } }
let gateGone=false;
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  const k=reduce?1:1-Math.pow(.002,dt*.5);
  camPos.lerp(tgtPos,k); camLook.lerp(tgtLook,k);
  const dr=reduce?0:1;
  camera.position.set(camPos.x+Math.sin(t*.13)*.04*dr+parX*.16*dr*(current?.3:1), camPos.y+Math.sin(t*.21)*.02*dr-parY*.07*dr, camPos.z);
  if(!look.drag){ const kk=Math.pow(.35,dt); look.yaw*=kk; look.pitch*=kk; }
  { const fwd=new THREE.Vector3().subVectors(camLook,camera.position); fwd.applyAxisAngle(UP,look.yaw); const rt=new THREE.Vector3().crossVectors(fwd,UP).normalize(); fwd.applyAxisAngle(rt,look.pitch); camera.lookAt(tmp.copy(camera.position).add(fwd)); }
  camera.updateMatrixWorld();
  { const fi=(flashOn&&gateGone&&pointer.active)?(current?.9:2.2):0; flash.intensity+=(fi-flash.intensity)*Math.min(1,dt*4);
    if(pointer.active){ ndc.set(pointer.x/canvas.clientWidth*2-1,-(pointer.y/canvas.clientHeight)*2+1); ray.setFromCamera(ndc,camera); flash.position.copy(camera.position).add(new THREE.Vector3(.34,-.4,.05).applyQuaternion(camera.quaternion)); flash.target.position.copy(ray.ray.origin).addScaledVector(ray.ray.direction,6); flash.target.updateMatrixWorld(); }
    if(VB){ const u=VB.material.uniforms; u.uInt.value=flash.intensity/2.2; u.uTime.value=reduce?0:t; VB.visible=flash.intensity>.02&&u.uStrength.value>0; u.uApex.value.copy(flash.position); u.uDir.value.subVectors(flash.target.position,flash.position).normalize(); VB.position.copy(flash.position); VB.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),u.uDir.value); } }
  const w=canvas.clientWidth,h=canvas.clientHeight;
  plants.forEach(p=>{ if(pointer.active){ tmp.copy(p.anchor).project(camera); const d=Math.hypot((tmp.x*.5+.5)*w-pointer.x,(-tmp.y*.5+.5)*h-pointer.y); if(tmp.z<1&&d<Math.max(90,w*.09)) p.rustle=Math.min(1,p.rustle+dt*4);} p.rustle*=Math.pow(.25,dt); });
  if(!reduce){ const gust=.5+.5*Math.sin(t*.23)*Math.sin(t*.07); leaves.forEach(L=>{const r=L.plant.rustle, a=L.amp*(1+r*4+gust*.8); L.mesh.rotation.x=L.tilt+Math.sin(t*L.f*(1+r*2.5)+L.ph)*a; L.mesh.rotation.z=Math.sin(t*L.f*.7*(1+r*2.5)+L.ph*1.3)*a*.8;}); }
  lamps.forEach((l,i)=>{ l.lv+=(l.level-l.lv)*Math.min(1,dt*5); let f=(1+Math.sin(t*2.1+l.ph)*.025)*l.lv; if(l.flick>0){ l.flick-=dt; if(Math.random()<.5) f*=.15; } else if(!reduce&&Math.random()<.003) f*=.45;
    l.pl.intensity=l.base*f; l.halo.material.opacity=.9*f; l.beam.material.uniforms.strength.value=.16*f; l.bulbM.color.setRGB(1,.886*Math.max(.35,f),.72*Math.max(.3,f)); LAMP_POS[i].y=3.07*(f>.3?1:-50);
    if(!reduce){ l.vel+=(-l.ang*5.5)*dt; l.vel*=Math.pow(.55,dt); l.ang+=l.vel*dt; l.grp.rotation.z=l.ang+Math.sin(t*.4+l.ph)*.006; l.grp.rotation.x=l.ang*.35; } });
  if(!reduce){ const hasP=pointer.active; fogs.forEach(f=>{ f.base.x+=f.v*dt; if(f.base.x>4) f.base.x=-4; if(f.base.x<-4) f.base.x=4;
    if(hasP){ const cp=ray.ray.closestPointToPoint(f.base,tmp); const away=new THREE.Vector3().subVectors(f.base,cp); const d=away.length(); if(d<1.4&&d>.0001) f.off.addScaledVector(away.normalize(),(1.4-d)*dt*1.6); }
    f.off.multiplyScalar(Math.pow(.5,dt)); f.s.position.copy(f.base).add(f.off); f.s.material.rotation=Math.sin(t*.05+f.ph)*.3; }); }
  const pa=mothG.attributes.position.array; mothP.forEach((m,i)=>{const a=t*m.s+m.ph; pa[i*3]=m.l.pos.x+Math.cos(a)*m.r; pa[i*3+1]=m.l.pos.y-.12+m.y+Math.sin(a*1.7)*.08; pa[i*3+2]=m.l.pos.z+Math.sin(a)*m.r;}); mothG.attributes.position.needsUpdate=true;
  if(!reduce){const d=dustG.attributes.position.array; for(let i=0;i<DN;i++){d[i*3+1]+=Math.sin(t*.3+i)*.0006; d[i*3]+=Math.cos(t*.2+i*1.3)*.0004;} dustG.attributes.position.needsUpdate=true;}
  Object.keys(ZONES).forEach(z=>{const b=labels[z]; tmp.copy(ZONES[z].label).project(camera); const vis=tmp.z<1&&Math.abs(tmp.x)<1.05&&Math.abs(tmp.y)<1.05; b.hidden=!vis||!gateGone||!!current; if(vis){b.style.left=((tmp.x*.5+.5)*w)+'px'; b.style.top=((-tmp.y*.5+.5)*h)+'px';}});
  if(post.on&&post.ready){ const fd=camera.position.distanceTo(camLook); post.focus+=(fd-post.focus)*Math.min(1,dt*3); const ap=current?.0022:.0004; post.aperture+=(ap-post.aperture)*Math.min(1,dt*2);
    post.bokeh.uniforms.focus.value=post.focus; post.bokeh.uniforms.aperture.value=post.aperture; post.comp.render(dt); }
  else renderer.render(scene,camera);
  checkPerf(); frameN++; if(frameN===4 && !/noenv/.test(location.search)) captureEnv();
  requestAnimationFrame(frame);
}
function captureEnv(){ try{ const rt=new THREE.WebGLCubeRenderTarget(128,{format:THREE.RGBFormat,generateMipmaps:true,minFilter:THREE.LinearMipmapLinearFilter}); rt.texture.encoding=THREE.sRGBEncoding;
  const cc=new THREE.CubeCamera(.1,60,rt); cc.position.set(0,1.8,-8); scene.add(cc);
  const glassObjs=[]; scene.traverse(o=>{ if(o.material===GLASS){ glassObjs.push(o); o.visible=false; } });
  const fogWas=scene.fog.density, au=renderer.shadowMap.autoUpdate; renderer.shadowMap.autoUpdate=false; scene.fog.density=.03; cc.update(renderer,scene); scene.fog.density=fogWas; renderer.shadowMap.autoUpdate=au; glassObjs.forEach(o=>o.visible=true); scene.remove(cc);
  GLASS.envMap=rt.texture; GLASS.envMapIntensity=1.6; GLASS.metalness=.55; GLASS.roughness=.07; GLASS.needsUpdate=true; }catch(e){} }
let frameN=0;
requestAnimationFrame(frame);
wireUI({openZone,closeZone,openDetail,gate:()=>{gateGone=true;}});

/* ---------- shared UI wiring ---------- */
function showPanel(title,intro,body){ $('ptitle').textContent=title; $('pintro').textContent=intro||''; $('pintro').style.display=intro?'':'none'; $('pbody').innerHTML=body; panel.classList.add('open'); panel.setAttribute('aria-hidden','false'); panel.scrollTop=0; setTimeout(()=>$('pclose').focus({preventScroll:true}),50);}
function hidePanel(){ panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); }
function wireUI(api){
  const gate=$('gate');
  function go(sound){ gate.classList.add('gone'); setTimeout(()=>gate.style.display='none',1300); if(sound) Audio.set(true); if(api&&api.gate) api.gate(); setTimeout(()=>{const h=$('hint'); if(h){h.style.opacity=0;}},7000); }
  $('enterSound').addEventListener('click',()=>go(true));
  $('enterQuiet').addEventListener('click',()=>go(false));
  $('sound').addEventListener('click',()=>Audio.set(!Audio.on));
  $('about').addEventListener('click',()=>{ if(api&&current) api.closeZone(); showPanel('About',null,ABOUT.replace('</ul></div>','</ul>'+checked+'</div>')); Audio.confirm(); });
  $('pclose').addEventListener('click',()=>{ if(api&&current) api.closeZone(); else { hidePanel(); Audio.back(); } });
  $('pbody').addEventListener('click',e=>{ const m=e.target.closest('.more'); const b=e.target.closest('.dback');
    if(m&&api){ api.openDetail(m.dataset.k,+m.dataset.i); }
    if(b&&api){ api.openZone(b.dataset.k); Audio.back(); } });
  document.querySelectorAll('[data-zone]').forEach(b=>b.addEventListener('click',()=>{ if(api) api.openZone(b.dataset.zone); else { const el=document.getElementById('fb-'+b.dataset.zone); if(el) el.scrollIntoView(); } }));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const db=document.querySelector('#pbody .dback'); if(api&&db){ api.openZone(db.dataset.k); Audio.back(); } else if(api&&current) api.closeZone(); else if(panel.classList.contains('open')){ hidePanel(); } } });
}
})();
